<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" /><meta name="referrer" content="no-referrer" />
  <title>Elements — Ορισμός κωδικού</title>
  <link rel="stylesheet" href="/styles.css?v=20261020-18" /><link rel="stylesheet" href="/admin/styles.css" />
</head>
<body class="admin-page">
  <header class="admin-header"><a class="brand" href="/"><span class="brand-mark">E</span><span class="brand-text"><strong>Elements</strong></span></a><a class="admin-back" href="/admin">Διαχείριση ↗</a></header>
  <main class="admin-shell">
    <div class="admin-intro"><p class="eyebrow">Elements · Ιδιωτική πρόσβαση</p><h1>Ο δικός σου κωδικός.</h1><p>Ο σύνδεσμος ορισμού κωδικού αποστέλλεται μόνο στο εξουσιοδοτημένο email σου και χρησιμοποιείται μία φορά.</p></div>
    <section class="admin-panel login-panel">
      <form id="requestForm"><label>Email διαχειριστή<input type="email" name="email" autocomplete="email" required /></label><button class="btn primary" type="submit">Αποστολή προσωρινού συνδέσμου</button></form>
      <form id="resetForm" hidden><label>Νέος κωδικός<input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="128" required /></label><label>Επιβεβαίωση κωδικού<input type="password" name="confirmation" autocomplete="new-password" minlength="12" maxlength="128" required /></label><p>Χρησιμοποίησε τουλάχιστον 12 χαρακτήρες.</p><button class="btn primary" type="submit">Αποθήκευση κωδικού</button></form>
      <p class="admin-status" id="resetStatus" role="status"></p>
      <a class="admin-back" href="/admin">Επιστροφή στη σύνδεση ↗</a>
    </section>
  </main>
  <script type="module" src="/admin/reset-password.js"></script>
</body>
</html>
